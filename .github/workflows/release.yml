name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: false
      revision:
        description: Git revision to embed
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: linux-amd64
          - goos: linux
            goarch: arm64
            name: linux-arm64
          - goos: darwin
            goarch: amd64
            name: darwin-amd64
          - goos: darwin
            goarch: arm64
            name: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build:frontend

      - name: Build release asset
        run: |
          version="${{ inputs.version }}"
          revision="${{ inputs.revision }}"
          if [[ -z "$version" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$revision" ]]; then
            revision="${GITHUB_SHA}"
          fi
          args=(--revision "$revision" --target "${{ matrix.goos }}/${{ matrix.goarch }}")
          if [[ -n "$version" ]]; then
            args+=(--version "$version")
          fi
          npm run release:build -- "${args[@]}"

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install release gate tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep sqlite3

      - name: Install Go lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install npm dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install chromium

      - name: Run release gate
        run: npm run release-check -- --full
        env:
          AGENT_TESTBENCH_SMOKE_STORE_DSN: sqlite://${{ runner.temp }}/agent-testbench-release-gate.sqlite

  publish:
    name: Publish release assets
    needs:
      - build
      - gate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release when missing
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ github.ref_name }}
        run: |
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" --title "AgentTestBench $tag" --notes "Release assets for $tag."

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ github.ref_name }}
        run: gh release upload "$tag" dist/*.tar.gz --clobber
